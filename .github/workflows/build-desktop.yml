name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            parallel: 4
          - os: windows-2022
            label: windows-x64
            parallel: 4
          - os: macos-15
            label: macos-arm64
            parallel: 2
          - os: macos-15-intel
            label: macos-x64
            parallel: 3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: SDL2 source (Windows/macOS)
        if: runner.os != 'Linux'
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-2.32.10
          path: work/ci-sdl
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libgl1-mesa-dev ninja-build
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          rustc --version
      - name: Configure Linux
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Configure macOS
        if: runner.os == 'macOS'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DVYRUZ_SDL_SOURCE="$PWD/work/ci-sdl" -DVYRUZ_ENABLE_SMAA=OFF -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
      - name: Configure Windows
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A x64 -DBUILD_TESTING=ON -DVYRUZ_SDL_SOURCE="$pwd/work/ci-sdl"
      - name: Build engine first
        run: cmake --build build --config Release --target vurus --parallel ${{ matrix.parallel }}
      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.parallel }}
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Standalone CLI smoke test
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            build/Release/vurus.exe --help
            build/Release/vurus.exe --licenses > build/licenses-smoke.txt
          else
            build/vurus --help
            build/vurus --licenses > build/licenses-smoke.txt
          fi
      - name: Package Linux
        if: runner.os == 'Linux'
        run: sh packaging/package_linux.sh build dist
      - name: Package Windows/macOS
        if: runner.os != 'Linux'
        run: cmake --build build --config Release --target package
      - name: Retain packages and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vurus-${{ matrix.label }}
          path: |
            dist/vurus-linux.tar.gz
            build/vurus-*.zip
            build/vurus-*.tar.gz
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vurus-*
          path: artifacts
      - name: Create draft release with tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          mapfile -d '' packages < <(find artifacts -type f \( -name 'vurus-*.zip' -o -name 'vurus-*.tar.gz' \) -print0)
          test "${#packages[@]}" -eq 4
          gh release create "$RELEASE_TAG" "${packages[@]}" --draft --title "Vurus $RELEASE_TAG" --notes "Native engine builds for Linux, Windows and macOS. Original game data is required and is not included."
